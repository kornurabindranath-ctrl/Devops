apiVersion: apps/v1
kind: Deployment

metadata:
  name: api

spec:
  replicas: 6

  selector:
    matchLabels:
      app: api

  template:

    metadata:
      labels:
        app: api

    spec:

      topologySpreadConstraints:

      - maxSkew: 1

        topologyKey: topology.kubernetes.io/zone

        whenUnsatisfiable: DoNotSchedule

        labelSelector:

          matchLabels:
            app: api

      containers:

      - name: nginx

        image: nginx
