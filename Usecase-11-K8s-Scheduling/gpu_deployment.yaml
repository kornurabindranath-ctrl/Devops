apiVersion: apps/v1
kind: Deployment

metadata:
  name: gpu-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gpu

  template:

    metadata:
      labels:
        app: gpu

    spec:

      tolerations:
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: accelerator
                operator: In
                values:
                - nvidia

      containers:
      - name: app
        image: nginx
