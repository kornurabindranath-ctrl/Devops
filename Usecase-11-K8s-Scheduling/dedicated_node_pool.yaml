apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus

    spec:

      tolerations:

      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

      affinity:

        nodeAffinity:

          requiredDuringSchedulingIgnoredDuringExecution:

            nodeSelectorTerms:

            - matchExpressions:

              - key: dedicated
                operator: In
                values:
                - monitoring

      containers:

      - name: prometheus

        image: prom/prometheus
