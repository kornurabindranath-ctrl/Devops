apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: qa-role
  namespace: qa

rules:

- apiGroups: [""]
  resources:
    - pods
    - services
    - events
  verbs:
    - get
    - list
    - watch

- apiGroups: [""]
  resources:
    - pods/log
  verbs:
    - get

- apiGroups: [""]
  resources:
    - pods/exec
    - pods/portforward
  verbs:
    - create

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch
