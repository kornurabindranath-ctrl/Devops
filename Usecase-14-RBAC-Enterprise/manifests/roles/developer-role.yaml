apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: developer-role
  namespace: dev-alpha

rules:

- apiGroups: [""]
  resources:
    - pods
  verbs:
    - get
    - list
    - watch
    - create
    - delete

- apiGroups: [""]
  resources:
    - pods/log
  verbs:
    - get

- apiGroups: [""]
  resources:
    - services
    - configmaps
    - events
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
  verbs:
    - update
    - patch
